apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.open-metadata.org/  # External Helm repo for OpenMetadata
    chart: openmetadata                       # Chart name
    targetRevision: 1.2.0                     # Chart version
    helm:
      valueFiles:
        - values.yaml                        # Custom values file in this Git repo
  destination:
    server: https://kubernetes.default.svc  # Your EKS cluster
    namespace: openmetadata                 # Target namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
